<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420" role="img" aria-label="Tech stack orbit" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B61FF"/>
      <stop offset="1" stop-color="#00D4FF"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#7B61FF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7B61FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- rings -->
  <g fill="none" stroke="#7B61FF" stroke-opacity="0.35" stroke-dasharray="3 6">
    <circle cx="210" cy="210" r="70"/>
    <circle cx="210" cy="210" r="110"/>
    <circle cx="210" cy="210" r="150"/>
  </g>

  <!-- center -->
  <circle cx="210" cy="210" r="62" fill="url(#halo)">
    <animate attributeName="r" values="56;70;56" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="210" cy="210" r="34" fill="url(#core)"/>
  <text x="210" y="219" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="800" fill="#ffffff">YF</text>

  <g font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12" font-weight="700" text-anchor="middle" fill="#e6edf3">

    <!-- ring 1 : clockwise -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 210 210" to="360 210 210" dur="18s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 280 210" to="-360 280 210" dur="18s" repeatCount="indefinite"/>
        <circle cx="280" cy="210" r="21" fill="#0d1117" stroke="#3776AB" stroke-width="2"/>
        <text x="280" y="214">Py</text>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 140 210" to="-360 140 210" dur="18s" repeatCount="indefinite"/>
        <circle cx="140" cy="210" r="21" fill="#0d1117" stroke="#3178C6" stroke-width="2"/>
        <text x="140" y="214">TS</text>
      </g>
    </g>

    <!-- ring 2 : counter-clockwise -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 210 210" to="-360 210 210" dur="26s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 210 320" to="360 210 320" dur="26s" repeatCount="indefinite"/>
        <circle cx="210" cy="320" r="21" fill="#0d1117" stroke="#009688" stroke-width="2"/>
        <text x="210" y="324">API</text>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 114.74 155" to="360 114.74 155" dur="26s" repeatCount="indefinite"/>
        <circle cx="114.74" cy="155" r="21" fill="#0d1117" stroke="#ffffff" stroke-width="2"/>
        <text x="114.74" y="159">Next</text>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 305.26 155" to="360 305.26 155" dur="26s" repeatCount="indefinite"/>
        <circle cx="305.26" cy="155" r="21" fill="#0d1117" stroke="#EA4B71" stroke-width="2"/>
        <text x="305.26" y="159">n8n</text>
      </g>
    </g>

    <!-- ring 3 : clockwise -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 210 210" to="360 210 210" dur="38s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 316.07 316.07" to="-360 316.07 316.07" dur="38s" repeatCount="indefinite"/>
        <circle cx="316.07" cy="316.07" r="21" fill="#0d1117" stroke="#00D4FF" stroke-width="2"/>
        <text x="316.07" y="320">LLM</text>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 103.93 316.07" to="-360 103.93 316.07" dur="38s" repeatCount="indefinite"/>
        <circle cx="103.93" cy="316.07" r="21" fill="#0d1117" stroke="#5C3EE8" stroke-width="2"/>
        <text x="103.93" y="320">CV</text>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 103.93 103.93" to="-360 103.93 103.93" dur="38s" repeatCount="indefinite"/>
        <circle cx="103.93" cy="103.93" r="21" fill="#0d1117" stroke="#26A5E4" stroke-width="2"/>
        <text x="103.93" y="108">TG</text>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 316.07 103.93" to="-360 316.07 103.93" dur="38s" repeatCount="indefinite"/>
        <circle cx="316.07" cy="103.93" r="21" fill="#0d1117" stroke="#2496ED" stroke-width="2"/>
        <text x="316.07" y="108">Dock</text>
      </g>
    </g>
  </g>
</svg>
