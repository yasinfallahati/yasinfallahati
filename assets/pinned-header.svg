<svg xmlns="http://www.w3.org/2000/svg" width="900" height="56" viewBox="0 0 900 56" role="img" aria-label="Pinned work">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="56" rx="12" fill="#0b1220"/>
  <rect x="1" y="1" width="898" height="54" rx="11" fill="none" stroke="url(#g)" stroke-width="1.5" opacity="0.85"/>
  <circle cx="28" cy="28" r="5" fill="#22d3ee" filter="url(#glow)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text x="44" y="34" fill="#e2e8f0" font-family="ui-sans-serif,system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700">PINNED · SELECTED SYSTEMS</text>
  <text x="870" y="34" text-anchor="end" fill="#64748b" font-family="ui-sans-serif,system-ui,Segoe UI,sans-serif" font-size="12">6 live builds</text>
</svg>
