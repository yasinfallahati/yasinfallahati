<svg xmlns="http://www.w3.org/2000/svg" width="900" height="100" viewBox="0 0 900 100" role="img">
  <rect width="900" height="100" rx="12" fill="#0B1220"/>
  <rect x="1" y="1" width="898" height="98" rx="11" fill="none" stroke="#A78BFA" stroke-opacity="0.35"/>
  <rect x="24" y="90" width="80" height="2" rx="1" fill="#A78BFA">
    <animate attributeName="width" values="40;140;40" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="50%" y="58%" text-anchor="middle" dominant-baseline="middle"
        font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
        font-size="20" font-weight="600" fill="#E2E8F0" opacity="0">
    <tspan fill="#A78BFA">› </tspan>Building automation &amp; AI products
    <animate attributeName="opacity" values="0;1;1;0;0"
      keyTimes="0;0.05;0.28;0.33;1"
      begin="0s" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="50%" y="58%" text-anchor="middle" dominant-baseline="middle"
        font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
        font-size="20" font-weight="600" fill="#E2E8F0" opacity="0">
    <tspan fill="#A78BFA">› </tspan>Python · FastAPI · n8n workflows
    <animate attributeName="opacity" values="0;1;1;0;0"
      keyTimes="0;0.05;0.28;0.33;1"
      begin="3s" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="50%" y="58%" text-anchor="middle" dominant-baseline="middle"
        font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
        font-size="20" font-weight="600" fill="#E2E8F0" opacity="0">
    <tspan fill="#A78BFA">› </tspan>Persian ↔ English bilingual systems
    <animate attributeName="opacity" values="0;1;1;0;0"
      keyTimes="0;0.05;0.28;0.33;1"
      begin="6s" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="50%" y="58%" text-anchor="middle" dominant-baseline="middle"
        font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
        font-size="20" font-weight="600" fill="#E2E8F0" opacity="0">
    <tspan fill="#A78BFA">› </tspan>From idea → shipped product
    <animate attributeName="opacity" values="0;1;1;0;0"
      keyTimes="0;0.05;0.28;0.33;1"
      begin="9s" dur="12s" repeatCount="indefinite"/>
  </text>
</svg>
