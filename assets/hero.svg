<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="Yasin Falahati — Software engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#171236"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9b8cff"/>
      <stop offset="0.55" stop-color="#7B61FF"/>
      <stop offset="1" stop-color="#00D4FF"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7B61FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7B61FF"/>
      <stop offset="1" stop-color="#00D4FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.07"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="1280" height="340" fill="url(#bg)"/>
  <rect width="1280" height="340" fill="url(#dots)"/>

  <!-- glowing orbs -->
  <circle cx="220" cy="90" r="150" fill="#7B61FF" opacity="0.35" filter="url(#blur)">
    <animate attributeName="cx" values="220;380;220" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="90;160;90" dur="14s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1060" cy="270" r="170" fill="#00D4FF" opacity="0.22" filter="url(#blur)">
    <animate attributeName="cx" values="1060;930;1060" dur="16s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="270;200;270" dur="16s" repeatCount="indefinite"/>
  </circle>

  <!-- floating particles -->
  <g fill="#9b8cff">
    <circle cx="610" cy="60" r="2.5" opacity="0.7"><animate attributeName="cy" values="60;40;60" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="300" r="2" opacity="0.5"><animate attributeName="cy" values="300;280;300" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="120" r="3" fill="#00D4FF" opacity="0.6"><animate attributeName="cy" values="120;100;120" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="310" r="2" fill="#00D4FF" opacity="0.5"><animate attributeName="cy" values="310;292;310" dur="4.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- text block -->
  <text x="80" y="112" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="16" letter-spacing="4" fill="#7B61FF">// SOFTWARE ENGINEER</text>
  <text x="80" y="192" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="78" font-weight="800" fill="url(#txt)">Yasin Falahati</text>
  <text x="82" y="240" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="23" fill="#9aa4b2">Automation  ·  Local-first AI  ·  Bilingual product systems</text>
  <text x="82" y="284" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="15" fill="#6e7681" letter-spacing="1">Python   FastAPI   Next.js   TypeScript   n8n   Docker</text>

  <!-- code window -->
  <g>
    <rect x="800" y="64" width="400" height="212" rx="14" fill="#0d1117" fill-opacity="0.88" stroke="#30363d"/>
    <circle cx="824" cy="86" r="5.5" fill="#ff5f56"/>
    <circle cx="844" cy="86" r="5.5" fill="#ffbd2e"/>
    <circle cx="864" cy="86" r="5.5" fill="#27c93f"/>
    <line x1="800" y1="106" x2="1200" y2="106" stroke="#21262d"/>
    <g font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="16">
      <text x="824" y="138"><tspan fill="#ff7b72">const</tspan><tspan fill="#e6edf3"> yasin </tspan><tspan fill="#ff7b72">=</tspan><tspan fill="#e6edf3"> {</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.02;0.07;0.92;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <text x="848" y="168"><tspan fill="#79c0ff">focus</tspan><tspan fill="#e6edf3">: [</tspan><tspan fill="#00D4FF">&quot;automation&quot;</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#00D4FF">&quot;ai&quot;</tspan><tspan fill="#e6edf3">],</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.12;0.17;0.92;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <text x="848" y="198"><tspan fill="#79c0ff">ships</tspan><tspan fill="#e6edf3">: </tspan><tspan fill="#00D4FF">&quot;production&quot;</tspan><tspan fill="#e6edf3">,</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.22;0.27;0.92;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <text x="848" y="228"><tspan fill="#79c0ff">langs</tspan><tspan fill="#e6edf3">: [</tspan><tspan fill="#00D4FF">&quot;fa&quot;</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#00D4FF">&quot;en&quot;</tspan><tspan fill="#e6edf3">],</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.32;0.37;0.92;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <text x="824" y="258" fill="#e6edf3">};
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.42;0.47;0.92;1" dur="9s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>

  <!-- bottom edge -->
  <rect x="0" y="336" width="1280" height="4" fill="url(#edge)"/>
</svg>
