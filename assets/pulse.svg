<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 60" width="1280" height="60" role="img" aria-label="" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7B61FF" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#7B61FF"/>
      <stop offset="0.75" stop-color="#00D4FF"/>
      <stop offset="1" stop-color="#00D4FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <path id="p" d="M0 30 H430 L460 30 L478 8 L498 52 L518 14 L534 30 H750 L780 30 L798 18 L816 44 L832 30 H1280"
        fill="none" stroke="url(#line)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"
        stroke-dasharray="2000" stroke-dashoffset="2000">
    <animate attributeName="stroke-dashoffset" values="2000;0;0;-2000" keyTimes="0;0.45;0.6;1" dur="6s" repeatCount="indefinite"/>
  </path>

  <circle r="4.5" fill="#00D4FF" filter="url(#glow)">
    <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.45;1" calcMode="linear">
      <mpath href="#p"/>
    </animateMotion>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.45;0.5;1" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>
